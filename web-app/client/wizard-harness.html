<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Wizard E2E Harness — UniversalImportWizard (U-2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
<style>
  :root { color-scheme: dark; }
  body { background: #0B0E14; color: #e5e7eb; font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 20px; color: #FFD700; }
  #status { margin: 12px 0; }
  pre { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; overflow: auto; max-height: 300px; font-size: 12px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
</style>
</head>
<body>
<h1>🧙 Wizard E2E Harness — UniversalImportWizard pasos 1–2 (shadow, sin POST)</h1>
<p>Uso manual: abrir con <code>?file=e2e-corpus/hoja2.xlsx&sheet=Hoja2&auto=1</code>. Uso CDP: <code>node scripts/wizard_e2e_u2.mjs</code>.</p>
<div id="status">Iniciando…</div>
<div id="root"></div>
<pre id="snap">{}</pre>

<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import UniversalImportWizard from '/src/components/import/UniversalImportWizard.jsx';
  import '/src/index.css';

  window.__WIZARD_BROWSER__ = true;
  window.__WIZARD_U2__ = { phase: 'boot' };

  const params = new URLSearchParams(location.search);
  const statusEl = document.getElementById('status');
  const snapEl = document.getElementById('snap');

  function paint(snap) {
    window.__WIZARD_U2__ = snap;
    window.dispatchEvent(new Event('wizard-u2'));
    snapEl.textContent = JSON.stringify(snap, null, 1);
    statusEl.innerHTML = snap.phase === 'diagnosed'
      ? `<span class="ok">✔ diagnosticado: paso ${snap.uiStep}, ${snap.regionCount} regiones, ${snap.nodeCount} nodos activos</span>`
      : (snap.phase === 'error'
        ? `<span class="err">✘ error: ${snap.error}</span>`
        : `… fase: ${snap.phase} (paso ${snap.uiStep})`);
  }

  async function boot() {
    const rel = params.get('file');
    const sheet = params.get('sheet');
    const pages = params.get('pages');
    const auto = params.get('auto') === '1';
    let initialFile = null;
    if (rel) {
      const res = await fetch('/' + rel);
      if (!res.ok) {
        paint({ phase: 'error', uiStep: 1, error: 'fetch ' + res.status });
        return;
      }
      const buf = await res.arrayBuffer();
      initialFile = new File([buf], rel.split('/').pop());
    }
    createRoot(document.getElementById('root')).render(
      React.createElement(UniversalImportWizard, {
        onClose: () => paint({ ...(window.__WIZARD_U2__ || {}), closed: true }),
        onSuccess: () => {},
        initialFile,
        initialSheet: sheet,
        initialPages: pages ? pages.split('-').map(Number) : null,
        autoStart: auto && !!initialFile,
        onStateChange: paint
      })
    );
  }

  boot().catch(e => paint({ phase: 'error', uiStep: 1, error: String(e && e.message || e) }));
</script>
</body>
</html>
